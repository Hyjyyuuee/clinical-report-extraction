[project]
name = "clinical-report-extraction"
version = "0.1.0"
description = "Structured finding extraction from chest X-ray reports: prompting vs QLoRA fine-tuning of open-weight LLMs."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "openai>=1.40",
]

[project.optional-dependencies]
train = [
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.19",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "wandb>=0.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
